<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.cdnfonts.com/css/nagista" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/montserrat" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="form.css" />
    <title>Formulaire Evasia</title>
  </head>
  <body>
    <section class="travel-form">
      <div class="contact-us">
        <h1>Votre voyage sur-mesure</h1>
        <form action="#">
          <label for="customerName">Nom <em>&#x2a;</em></label
          ><input
            id="customerName"
            name="customerName"
            required=""
            type="text"
          />
          <label for="customerName">Prénom <em>&#x2a;</em></label
          ><input
            id="customerSurname"
            name="customerSurname"
            required=""
            type="text"
          /><label for="customerEmail">Email <em>&#x2a;</em></label
          ><input
            id="customerEmail"
            name="customerEmail"
            required=""
            type="email"
          />
          <label for="departureDate">Date du départ <em>&#x2a;</em></label
          ><input
            id="departureDate"
            type="date"
            name="date"
            placeholder="Date du voyage"
            required
            autocomplete="off"
          />
          <label for="tripDuration">Durée du voyage <em>&#x2a;</em></label>
          <select autocomplete="off" id="tripDuration">
            <option value=""></option>
            <option value="10">10 jours</option>
            <option value="20">15 jours</option>
            <option value="30">20 jours</option>
          </select>
          <label for="customerEmail">Nombre de voyageurs <em>&#x2a;</em></label
          ><input
            type="number"
            name="nbre"
            placeholder="Nombre de voyageurs"
            min="0"
            max="100"
            required
            autocomplete="off"
          /><label for="customerPhone"
            >Type de voyage (solo, en couple, en famille, entre amis,...)
            <em>&#x2a; </em></label
          ><input
            id="customerPhone"
            name="customerPhone"
            pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
            type="tel"
          /><label for="orderNumber"
            >Budget par personne hors vols (en euros) <em>&#x2a; </em></label
          ><input id="orderNumber" name="orderNumber" type="text" /><label
            for="customerNote"
            >Vos envies pour ce voyage <em>&#x2a;</em></label
          ><textarea
            id="customerNote"
            name="customerNote"
            required=""
            rows="4"
          ></textarea>
          <br />
          <button id="customerOrder">SUBMIT</button>
        </form>
      </div>
    </section>
  </body>
</html>
