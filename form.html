<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.cdnfonts.com/css/nagista" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/montserrat" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="form.css" />
    <title>Formulaire Evasia</title>

    <style>
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .modal-overlay.is-open {
        display: flex;
        animation: fadeIn 0.25s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .modal {
        background: #f8f4e5;
        border-radius: 16px;
        padding: clamp(28px, 6vw, 52px) clamp(24px, 6vw, 48px);
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
        animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
      }

      @keyframes slideUp {
        from {
          transform: translateY(32px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .modal-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #6bd4b1;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
      }

      .modal-icon svg {
        width: 32px;
        height: 32px;
        stroke: white;
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .modal h2 {
        font-family: "Montserrat", system-ui, sans-serif;
        font-size: clamp(18px, 3vw, 22px);
        color: #d28864;
        margin: 0 0 12px;
      }

      .modal p {
        font-family: "Inter", system-ui, sans-serif;
        font-size: 15px;
        color: #6b6358;
        line-height: 1.6;
        margin: 0 0 28px;
      }

      .modal-cta {
        display: inline-block;
        background: #f45702;
        color: white;
        font-family: "Montserrat", system-ui, sans-serif;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 1.5px;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 10px;
        transition: 0.2s all ease-in-out;
        border-bottom: 2px solid transparent;
      }

      .modal-cta:hover {
        background: #f8f4e5;
        color: #f45702;
        border-bottom: 2px solid #f45702;
      }

      .modal-close {
        position: absolute;
        top: 14px;
        right: 16px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 22px;
        color: #c8b99a;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 6px;
        transition: color 0.15s;
        width: auto;
        min-height: unset;
        margin-top: 0;
        float: none;
      }

      .modal-close:hover {
        color: #d28864;
        background: none;
        border-bottom: none;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <section class="travel-form">
      <div class="contact-us">
        <h1>Votre voyage sur-mesure</h1>

        <form
          id="travelForm"
          name="voyage-sur-mesure"
          method="POST"
          data-netlify="true"
          netlify-honeypot="bot-field"
          netlify
        >
          <input type="hidden" name="form-name" value="voyage-sur-mesure" />

          <!-- Honeypot anti-spam -->
          <p class="hidden">
            <label>
              Ne pas remplir ce champ :
              <input name="bot-field" />
            </label>
          </p>

          <label for="customerName">Nom <em>&#x2a;</em></label>
          <input id="customerName" name="customerName" required type="text" />

          <label for="customerSurname">Prénom <em>&#x2a;</em></label>
          <input
            id="customerSurname"
            name="customerSurname"
            required
            type="text"
          />

          <label for="customerEmail">Email <em>&#x2a;</em></label>
          <input
            id="customerEmail"
            name="customerEmail"
            required
            type="email"
          />

          <label for="departureDate">Date du départ <em>&#x2a;</em></label>
          <input
            id="departureDate"
            type="date"
            name="departureDate"
            placeholder="Date du voyage"
            required
            autocomplete="off"
          />

          <label for="tripDuration">Durée du voyage <em>&#x2a;</em></label>
          
          <input id="tripDuration" name="tripDuration" type="text" required />

          <label for="nbre">Nombre de voyageurs <em>&#x2a;</em></label>
          <input
            type="number"
            id="nbre"
            name="nbre"
            placeholder="Nombre de voyageurs"
            min="1"
            max="100"
            required
            autocomplete="off"
          />

          <label for="travelType">
            Type de voyage (solo, en couple, en famille, entre amis,...)
            <em>&#x2a;</em>
          </label>
          <input id="travelType" name="travelType" type="text" required />

          <label for="budgetPerPerson">
            Budget par personne hors vols (en euros) <em>&#x2a;</em>
          </label>
          <input
            id="budgetPerPerson"
            name="budgetPerPerson"
            type="text"
            required
          />

          <label for="customerNote">
            Vos envies pour ce voyage <em>&#x2a;</em>
          </label>
          <textarea
            id="customerNote"
            name="customerNote"
            required
            rows="4"
          ></textarea>

          <br />
          <button type="submit" id="customerOrder">ENVOYER</button>
        </form>
      </div>
    </section>

    <!-- ====== MODAL ====== -->
    <div
      class="modal-overlay"
      id="successModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal">
        <button class="modal-close" id="modalClose" aria-label="Fermer">
          &#x2715;
        </button>

        <div class="modal-icon">
          <svg viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>

        <h2 id="modalTitle">Merci pour votre demande&nbsp;!</h2>
        <p>
          Nous avons bien reçu votre formulaire et reviendrons vers vous très
          prochainement.<br /><br />
          Vous préférez échanger de vive voix ? Prenez rendez-vous pour un appel
          avec notre équipe.
        </p>

        <a
          class="modal-cta"
          href="https://calendly.com/"
          target="_blank"
          rel="noopener"
        >
          📞 &nbsp;PRENDRE RENDEZ-VOUS
        </a>
      </div>
    </div>

    <script>
      const form = document.getElementById("travelForm");
      const modal = document.getElementById("successModal");
      const closeBtn = document.getElementById("modalClose");
      const submitBtn = document.getElementById("customerOrder");

      function encode(data) {
        return Object.keys(data)
          .map((key) => {
            const value = data[key] ?? "";
            return encodeURIComponent(key) + "=" + encodeURIComponent(value);
          })
          .join("&");
      }

      async function handleSubmit(e) {
        e.preventDefault();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "ENVOI...";

        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        try {
          const response = await fetch("/", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: encode(data),
          });

          if (response.ok) {
            form.reset();
            modal.classList.add("is-open");
            closeBtn.focus();
          } else {
            alert(
              "Une erreur est survenue lors de l'envoi. Merci de réessayer.",
            );
          }
        } catch (error) {
          alert("Impossible d'envoyer le formulaire pour le moment.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "ENVOYER";
        }
      }

      function closeModal() {
        modal.classList.remove("is-open");
      }

      form.addEventListener("submit", handleSubmit);
      closeBtn.addEventListener("click", closeModal);

      modal.addEventListener("click", function (e) {
        if (e.target === modal) {
          closeModal();
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modal.classList.contains("is-open")) {
          closeModal();
        }
      });
    </script>
  </body>
</html>
