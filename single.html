<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article - EVASIA</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/a2d9d5a94e.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <ul class="nav_links">
        <li><a href="index.html#header">Accueil</a></li>
        <li><a href="index.html#about">À propos</a></li>
        <li><a href="index.html#voyages">Voyages</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="index.html#contacts">Contact</a></li>
      </ul>
      <div class="burger"><span></span><span></span><span></span></div>
    </nav>

    <!-- HEADER -->
    <header
      id="header"
      class="article-header"
      style="background-size: cover; background-position: center"
    >
      <div class="header_title">
        <h1 id="article-title">Chargement...</h1>
      </div>
    </header>

    <!-- SECTION ARTICLE -->
    <main id="article">
      <section class="article_container">
        <div class="about_all">
          <div id="article-content" class="article_content">
            <p>Chargement de l’article en cours...</p>
          </div>
        </div>
      </section>
    </main>

    <!-- RETOUR -->
    <div class="article_back">
      <a href="blog.html" class="btn">← Retour au blog</a>
    </div>

    <!-- FOOTER -->
    <footer
      style="
        background-color: #b7a58a;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
      "
    >
      <p>© 2025 EVASIA - Tous droits réservés</p>
    </footer>

    <!-- SCRIPT -->
    <script>
      // === BURGER ===
      const burger = document.querySelector(".burger");
      const navLinks = document.querySelector(".nav_links");
      burger.addEventListener("click", () => {
        navLinks.classList.toggle("active");
        burger.classList.toggle("toggle");
      });

      // === RÉCUPÉRER L’ID DANS L’URL ===
      const params = new URLSearchParams(window.location.search);
      const articleId = params.get("id");

      // === URL DE TA GOOGLE SHEET ===
      const sheetURL =
        "https://opensheet.elk.sh/1bAv_iJ0U1hETDp5CAgwRIZacgwNJ0E8F7YfBKEMz7u8/Feuille1"; // 🔁 Mets ici ton URL opensheet

      async function loadArticle() {
        try {
          const response = await fetch(sheetURL);
          const data = await response.json();

          const article = data.find((a) => a.id === articleId);

          if (!article) {
            document.getElementById("article-content").innerHTML =
              "<p>Article introuvable.</p>";
            return;
          }

          // Titre et image d’en-tête
          document.getElementById("article-title").textContent = article.titre;
          document.querySelector(
            ".article-header"
          ).style.backgroundImage = `url('${article.image}')`;

          // Charger le contenu depuis le Google Doc (exporté en HTML)
          const docResponse = await fetch(article.docURL);
          const docHTML = await docResponse.text();

          document.getElementById("article-content").innerHTML = docHTML;
        } catch (error) {
          console.error("Erreur :", error);
          document.getElementById("article-content").innerHTML =
            "<p>Impossible de charger l’article.</p>";
        }
      }

      loadArticle();
    </script>

    <!-- STYLES SPÉCIFIQUES ARTICLE -->
    <style>
      .article_container {
        background-color: #fff;
        padding: 100px 0;
      }

      .article_content {
        font-family: "Montserrat", sans-serif;
        font-size: 17px;
        line-height: 1.8;
        color: #333;
        max-width: 800px;
        margin: auto;
      }

      .article_content h2,
      .article_content h3 {
        font-family: "nagistademo", sans-serif;
        color: #b7a58a;
      }

      .article_content img {
        max-width: 100%;
        border-radius: 15px;
        margin: 30px 0;
      }

      .article_content a {
        color: #d28864;
        text-decoration: underline;
      }

      .article_back {
        text-align: center;
        margin-bottom: 80px;
      }

      .btn {
        background-color: #d28864;
        color: white;
        padding: 10px 25px;
        text-decoration: none;
        border-radius: 10px;
        transition: background-color 0.3s ease;
      }

      .btn:hover {
        background-color: #b76e49;
      }

      .article-content {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
        font-family: "Montserrat", sans-serif;
        line-height: 1.8;
        color: #333;
      }

      .article-content h1,
      .article-content h2,
      .article-content h3 {
        font-family: "Nagista", serif;
        color: #0a3d62;
      }

      .article-content img {
        width: 100%;
        border-radius: 12px;
        margin: 20px 0;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      @media screen and (max-width: 768px) {
        .article_content {
          width: 90%;
          font-size: 15px;
        }
      }
    </style>
  </body>
</html>
